version: "3.9"
services:
  mariadb:
    image: mariadb:11.3
    container_name: mariadb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 10s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  backend:
      build:
        context: ./spring-backend
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
      depends_on:
        - mariadb
      environment:
        SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/shop
        SPRING_DATASOURCE_USERNAME: shopuser
        SPRING_DATASOURCE_PASSWORD: shoppass

  frontend:
      build:
        context: ./vue-frontend
        # for development
        dockerfile: Dockerfile.dev  
        # for deployment
        # dockerfile: Dockerfile  
      ports:
        - "5173:5173"


volumes:
  db_data: