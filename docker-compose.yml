services:
  mariadb:
    image: mariadb:11.3
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
      start_period: 10s
    environment:
      MARIADB_DATABASE: ischeroth_infos
      MARIADB_USER: ${DATABASE_USER:?Set DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./spring-backend
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE:-jdbc:mariadb://mariadb:3306/ischeroth_infos}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:?Set DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ${DIALECT:-org.hibernate.dialect.MariaDBDialect}

  frontend:
    build:
      context: ./vue-frontend
    depends_on:
      - backend

volumes:
  db_data:
