version: "3.9"
services:
  mariadb:
    image: mariadb:11.3
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./spring-backend
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile  
    ports:
      - "5173:80"
    # volume not needed in production
    volumes:                  
      - ./vue-frontend:/app


volumes:
  db_data: